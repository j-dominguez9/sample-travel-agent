[project]
name = "arize-fde-agent"
version = "0.1.0"
description = "A simple AI travel agent (CLI + FastAPI) built on the Anthropic API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.2.0",
    "arize-phoenix-client[evals,pytest]>=3.3.0",
    "arize-phoenix-evals>=3.5.1",
    "arize-phoenix-otel>=0.17.1",
    "fastapi[standard]==0.139.0",
    "httpx==0.28.1",
    "openinference-instrumentation-anthropic>=2.1.1",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "pandas>=3.0.5",
    "pytest>=9.1.1",
    "python-dotenv==1.2.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "uvicorn[standard]==0.51.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "backend", "common", "evals"]

[dependency-groups]
dev = [
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.5",
    "ty>=0.0.77",
]

[tool.ty.src]
# Airflow is the deployment's runtime, not a project dependency, so `dags/`
# cannot type-check here. Excluding it keeps `ty`'s diagnostic count usable as
# a signal — the number changing is what matters, and six permanent
# unresolved-import errors would drown that out.
exclude = ["dags"]
