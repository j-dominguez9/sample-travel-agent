# Per-agent configuration. The DAGs expand over every file matching
# evals/agents/*/config.yaml, so adding agent two is a new directory and this
# file — not a change to the framework or the DAG.

agent: travel
project: travel-agent                 # Phoenix project carrying production traces
dataset: travel-golden-v1
agent_span_name: travel_agent

monitoring:
  # Three hours, not one. At production volume an hour is plenty, but the
  # judges only grade the turns they apply to — 65% of traffic for the
  # grounding judges, 35% for graceful_alternative — and below `min_sample`
  # they report nothing at all. An hourly window that silences the four most
  # valuable evaluators is worse than a three-hourly one that doesn't.
  schedule: "0 */3 * * *"
  window_minutes: 180
  # SPANS, not turns: one turn is ~8 spans (agent + LLM + one per tool call).
  # The previous 200 capped every sweep at ~25 turns regardless of traffic,
  # which is what was actually starving the judges.
  limit: 2000
  # Cost ceiling on the LLM judges only; code evaluators still see every turn,
  # because sampling an invariant like no_unredacted_pii defeats its purpose.
  # A no-op below 150 turns, so it never eats into min_sample.
  judge_max_turns: 150
  # Never alert on a thin sample. An earlier sweep put graceful_alternative at
  # n=2 and reported 50%; acting on that would be acting on one conversation.
  min_sample: 20

# Direction comes from the evaluator registry, so a threshold only has to say
# which side of the line is bad. Rates are fractions of applicable turns.
thresholds:
  flight_direction:        {min_rate: 0.99}
  no_fabricated_flights:   {min_rate: 0.99}
  weather_values_plausible: {min_rate: 0.99}
  no_internal_leak:        {min_rate: 0.95}
  # Both from axial coding over production traces
  # (coding-run:travel-agent-failure-taxonomy-2026-09-01).
  past_date_still_searched: {min_rate: 0.95}
  derived_totals_are_correct: {min_rate: 0.99}
  # A single occurrence is an incident, not a trend — hence 1.0, and hence
  # page_on below rather than a quiet notify.
  no_unredacted_pii:       {min_rate: 1.0}
  # Same reasoning. A user who thinks a seat is held and a deposit taken finds
  # out at the airport, and nothing in the reply told them otherwise — so this
  # is an invariant that pages, not a quality trend.
  booking_limits_disclosed: {min_rate: 1.0}
  hallucination:           {max_rate: 0.05}   # minimize: flagged fraction
  recommendation_grounded: {min_rate: 0.90}
  tool_response_handling:  {min_rate: 0.85}
  graceful_alternative:    {min_rate: 0.80}
  # Stochastic by nature — the model choosing to call a tool. Measured at
  # 98.8-99.2%, so this floor catches a real collapse without firing on the
  # ordinary miss the PR gate deliberately tolerates.
  tool_selection:          {min_rate: 0.97}

alerting:
  # Discovery call: groundedness and correctness page the Head of Product and
  # the engineering team at low single digits.
  owners:
    - head-of-product
    - agent-engineering
  page_on:
    - flight_direction
    - no_fabricated_flights
    - hallucination
    - recommendation_grounded
    - no_unredacted_pii
    - booking_limits_disclosed

regression:
  schedule: "0 3 * * *"
  evaluators:
    - hallucination
    - recommendation_grounded
    - no_fabricated_flights
    - flight_direction
    # The PR gate logs tool_selection but cannot assert it — whether the model
    # chooses to call a tool is stochastic (98.8-99.2% measured over n=597), and
    # asserting it per case reddens ~a third of CI runs. It is gated here
    # instead, on the aggregate over 199 examples x 3 repetitions.
    - tool_selection
  repetitions: 3
  # Alert if a metric moves more than this against the previous nightly run.
  # Catches drift with no code change — a provider model update, a prompt edit
  # merged elsewhere — which CI structurally cannot see.
  drift_tolerance: 0.10

# Discovery: "no existing dashboards, establish separate dashboard for this
# (cost, token usage)". Phoenix computes cost natively from its own pricing
# table, so this only says where to look and what counts as too expensive.
cost:
  # Where the judges' own spend lands. Reported next to agent spend because
  # adopting this system is itself an operating cost the customer is taking on.
  eval_project: evaluators
  # Stated volume from the discovery call: ~1M conversations a year.
  annual_conversations: 1000000
  # No unit economic was given, so this is an assumption, not a requirement —
  # set to roughly 3x the currently measured rate so it catches a step change
  # rather than ordinary variation. Notifies; it is not an incident.
  max_cost_per_conversation: 0.05

curation:
  # Flagged production turns become candidate golden cases. Never merged
  # automatically: the customer requires a human in the loop for regressions.
  enabled: true
  candidates_dataset: travel-candidates
  max_per_run: 25
